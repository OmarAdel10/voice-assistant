# Voice Assistant Configuration

stt:
  model_size: "large-v3"
  device: "cuda"
  compute_type: "int8"
  max_listen_seconds: 5
  language: null  # auto-detect (was "ar" which forced Arabic)
  allowed_languages: ["ar", "en"]  # restrict to Arabic and English only
  language_detection_threshold: 0.7  # stricter detection (was 0.5)
  vad_threshold: 0.5
  model_dir: "models/stt"
  vad_filter: true
  vad_min_silence_ms: 500
  initial_prompt: null  # set by voice enrollment (--enroll)

tts:
  engine: "piper"
  rate: 180
  volume: 0.9
  voice_id: null
  piper_voice_dir: "models/tts"
  piper_voice_ar: "ar_JO-kareem-medium"
  piper_voice_en: "en_US-lessac-medium"
  piper_voice_ar_fallback: "ar_JO-kareem-low"
  piper_voice_en_fallback: "en_US-lessac-low"

nlp:
  confidence_threshold: 0.6
  confidence_threshold_ar: 0.5
  confidence_threshold_en: 0.6

audio:
  sample_rate: 16000
  channels: 1

log:
  level: "INFO"