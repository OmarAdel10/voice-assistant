[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant"
version = "0.1.0"
description = "Offline-first voice assistant for academic field training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "pyttsx3>=2.90",
    "gTTS>=2.5",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psutil>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
voice-assistant = "voice_assistant.main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = []
fixable = ["E", "F", "I", "UP", "B", "C4", "SIM"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "config*", "voice_assistant*"]